<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login', '/css/login.css')}"></head>
<body>
	<main class="login-layout">
		<section class="login-card" aria-labelledby="login-title">
			<header class="login-form-header">
				<p class="login-name" th:text="${nomeAplicacao}">Login Seguro</p>
				<h1 id="login-title">Acesse sua conta</h1>
				<p>Entre com seu nome de usuário e senha.</p>
			</header>
			<div class="login-alert login-alert-error" role="alert" th:if="${param.error}">
				Nome de usuário ou senha inválidos.
			</div>
			<div class="login-alert login-alert-success" role="status" th:if="${param.logout}">
				Sessão encerrada com sucesso.
			</div>

			<form class="login-form" th:action="@{/login}" method="post">
				<div class="login-field">
					<label for="username">Nome de usuário</label>
					<div class="login-control">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0m8-11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
						<input id="username" name="username" type="text"
								placeholder="Digite seu nome de usuário" autocomplete="username"
								required autofocus>
					</div>
				</div>

				<div class="login-field">
					<label for="password">Senha</label>
					<div class="login-control">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V7a6 6 0 0 1 12 0v3M5 10h14v11H5V10Zm7 5v2"/></svg>
						<input id="password" name="password" type="password"
								placeholder="Digite sua senha" autocomplete="current-password" required>
						<button class="login-password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
						</button>
					</div>
				</div>

				<button class="login-submit" type="submit">Entrar</button>
			</form>
		</section>
	</main>
	<script th:src="@{/js/login.js}"></script>
</body>
</html>
