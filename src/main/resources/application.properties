spring.application.name=login-seguro

# Credenciais externas ao codigo: em Atlas, use a URI mongodb+srv fornecida pelo cluster (TLS).
# O fallback sem credenciais destina-se exclusivamente ao desenvolvimento com MongoDB local.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/login_seguro}
spring.data.mongodb.auto-index-creation=true

spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Personalizacao visual independente da autenticacao, dos perfis e da persistencia.
app.interface.nome=${APP_INTERFACE_NOME:Login Seguro}
app.interface.tema-css=${APP_INTERFACE_TEMA_CSS:/css/theme.css}

# A criacao do primeiro administrador e opcional e usa somente variaveis de ambiente.
app.admin-inicial.enabled=${APP_ADMIN_INICIAL_ENABLED:false}
app.admin-inicial.nome=${APP_ADMIN_INICIAL_NOME:}
app.admin-inicial.sobrenome=${APP_ADMIN_INICIAL_SOBRENOME:}
app.admin-inicial.email=${APP_ADMIN_INICIAL_EMAIL:}
app.admin-inicial.nome-usuario=${APP_ADMIN_INICIAL_NOME_USUARIO:}
app.admin-inicial.senha=${APP_ADMIN_INICIAL_SENHA:}
